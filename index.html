<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Nacional de Datos del Ecosistema Social</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
    :root{
      --green:#4F7C45;
      --blue:#305C5A;
      --sage:#A8B88A;
      --earth:#C77945;
      --beige:#F3E6D3;
      --bg:#FAF6EF;
      --ink:#26332D;
      --border:#E6D8C4;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
    .layout{display:flex;min-height:100vh}
    aside{width:290px;background:#fff;border-right:1px solid var(--border);padding:22px;position:fixed;left:0;top:0;bottom:0;box-shadow:0 1px 16px rgba(0,0,0,.04)}
    main{margin-left:290px;width:calc(100% - 290px)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:34px}
    .logo{width:46px;height:46px;border-radius:18px;background:var(--green);display:grid;place-items:center;color:white;font-size:22px;font-weight:800}
    .brand small{color:var(--green);font-weight:700;letter-spacing:.04em}
    .brand h1{font-size:17px;line-height:1.1;margin:3px 0 0;color:var(--blue)}
    nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#53605d;text-align:left;padding:12px 13px;border-radius:14px;cursor:pointer;font-size:14px}
    nav button:hover{background:#f1eee7}
    nav button.active{background:var(--green);color:#fff}
    .notice{position:absolute;bottom:22px;left:22px;right:22px;background:var(--beige);border-radius:18px;padding:15px;font-size:12px;line-height:1.45;color:#59625f}
    .notice strong{display:block;color:var(--green);margin-bottom:5px}
    header{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px}
    header small{font-weight:800;color:var(--sage);letter-spacing:.18em;text-transform:uppercase}
    header h2{margin:5px 0 0;color:var(--blue);font-size:28px}
    .content{padding:28px 30px 60px}
    .eyebrow{font-size:13px;font-weight:800;color:var(--sage);letter-spacing:.18em;text-transform:uppercase;margin:0 0 8px}
    .title{font-size:32px;line-height:1.1;color:var(--blue);margin:0 0 10px}
    .lead{color:#65716d;max-width:900px;line-height:1.55;margin:0 0 24px}
    .grid{display:grid;gap:16px}
    .stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
    .two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 1px 14px rgba(0,0,0,.04);padding:20px}
    .stat{display:flex;justify-content:space-between;align-items:flex-start}
    .stat p{margin:0;color:#66716d;font-size:13px}
    .stat h3{font-size:32px;color:var(--blue);margin:9px 0 0}
    .icon{background:var(--beige);color:var(--green);border-radius:16px;width:42px;height:42px;display:grid;place-items:center}
    .chart{height:230px;display:flex;align-items:end;gap:9px;border-top:1px solid #f1eee7;padding-top:16px}
    .barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
    .bar{width:100%;border-radius:9px 9px 0 0;background:var(--green);min-height:16px}
    .bar.blue{background:var(--blue)}
    .bar.earth{background:var(--earth)}
    .barlabel{font-size:11px;color:#66716d;text-align:center;max-width:80px}
    .insight{display:flex;gap:13px;align-items:flex-start}
    .spark{color:var(--earth);font-size:24px}
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
    input,select,textarea{border:1px solid var(--border);border-radius:14px;padding:11px 12px;background:#fff;color:#42504c;font-size:14px}
    .mapgrid{grid-template-columns:1.35fr .65fr}
    .real-map{
  height:560px;
  border-radius:24px;
  overflow:hidden;
  background:var(--beige);
  border:1px solid var(--border);
}

.leaflet-container{
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

.territoria-marker-shell{
  background:transparent;
  border:0;
}

.territoria-div-marker{
  width:38px;
  height:38px;
  border-radius:999px;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;
  border:3px solid white;
  box-shadow:0 8px 22px rgba(0,0,0,.28);
}

.territoria-div-marker.filtered{
  background:var(--earth);
}

.territoria-div-marker.selected{
  background:var(--blue);
  transform:scale(1.15);
}

.leaflet-tooltip{
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.14);
  color:var(--ink);
}
    .colombia{position:absolute;left:29%;top:8%;width:46%;height:82%;border:2px dashed rgba(127,175,153,.45);border-radius:45%;background:rgba(255,255,255,.28)}
    .pin{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:15px;padding:9px 11px;background:#fff;color:var(--blue);box-shadow:0 8px 24px rgba(0,0,0,.12);cursor:pointer;text-align:left;min-width:112px}
    .pin.active{background:var(--green);color:white}
    .pin strong{font-size:12px}
    .pin span{display:block;font-size:11px;opacity:.78;margin-top:3px}
    .info-row{border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px}
    .info-row small{display:block;text-transform:uppercase;color:#7b8582;font-size:11px;letter-spacing:.05em}
    .info-row strong{display:block;color:var(--blue);margin-top:5px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{background:var(--beige);color:#59625f;text-transform:uppercase;font-size:11px;letter-spacing:.05em;text-align:left;padding:12px}
    td{padding:13px 12px;border-top:1px solid #eee9df;vertical-align:top}
    tr:hover td{background:#fbfaf7}
    .badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#EEF3E5;color:#4F7C45}
    .badge.warn{background:#fff0d8;color:#8b5a12}
    .badge.info{background:#E4EFEA;color:#305C5A}
    .btn{border:0;background:var(--green);color:white;border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn:hover{background:var(--blue)}
    .btn.outline{background:white;color:#50605b;border:1px solid var(--border)}
    .profile{grid-template-columns:.8fr 1.2fr}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:var(--beige);border-radius:999px;padding:7px 10px;font-size:12px;color:#53605d}
.network-wrap{
  height:560px;
  background:
    radial-gradient(circle at 50% 45%, rgba(168,184,138,.22), transparent 34%),
    linear-gradient(135deg,#fbfaf7,#f7efe4);
  border-radius:24px;
  width:100%;
  overflow:hidden;
  border:1px solid var(--border);
  position:relative;
}

.network{
  width:100%;
  height:100%;
  display:block;
}

.network-link{
  fill:none;
  stroke:#A8B88A;
  stroke-width:2;
  opacity:.36;
}

.network-link.strong{
  stroke:#4F7C45;
  stroke-width:3.2;
  opacity:.55;
}

.network-node{
  cursor:pointer;
  transition:.18s ease;
}

.network-node circle{
  stroke:white;
  stroke-width:4;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));
}

.network-node:hover circle{
  transform:scale(1.08);
}

.network-node.selected circle{
  stroke:var(--earth);
  stroke-width:6;
}

.network-label{
  font-size:12px;
  fill:var(--blue);
  font-weight:800;
  paint-order:stroke;
  stroke:#fff;
  stroke-width:5px;
  stroke-linejoin:round;
}

.network-subtitle{
  font-size:10px;
  fill:#6d7773;
  paint-order:stroke;
  stroke:#fff;
  stroke-width:4px;
}

.network-center-label{
  font-size:16px;
  fill:var(--blue);
  font-weight:900;
  text-anchor:middle;
}

.network-center-small{
  font-size:11px;
  fill:#6d7773;
  text-anchor:middle;
}

.network-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:7px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  color:#53605d;
}

.legend-dot{
  width:11px;
  height:11px;
  border-radius:999px;
  display:inline-block;
}
    .opp{cursor:pointer}
    .opp.selected{outline:2px solid var(--sage)}
    .score{font-size:34px;color:var(--green);font-weight:900}
    .alert{display:flex;gap:13px;align-items:flex-start}
    .form{grid-template-columns:repeat(2,minmax(0,1fr))}
    .form input,.form select,.form textarea{width:100%}
    .toast{position:fixed;right:24px;bottom:24px;background:var(--green);color:white;border-radius:18px;padding:14px 18px;box-shadow:0 12px 30px rgba(0,0,0,.22);display:none;z-index:20}
    .toast.show{display:block}
    .mobile-warning{display:none;background:var(--beige);padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px}
    @media(max-width:1050px){
      aside{position:static;width:100%;height:auto}
      .layout{display:block}
      main{margin-left:0;width:100%}
      .notice{position:static;margin-top:16px}
      nav{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
      .stats,.two,.three,.mapgrid,.profile,.form{grid-template-columns:1fr}
      header{position:static}
      .mobile-warning{display:block}
    }
  </style>
</head>

  <div class="layout">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const territories=[
{name:"Barichara",dept:"Santander",x:58,y:38,lat:6.6357,lng:-73.2228,actors:42,capital:"Capital cultural",ft:"Fundación Barichara Regenerativa",opportunities:8},
{name:"Bogotá",dept:"Cundinamarca",x:54,y:52,lat:4.7110,lng:-74.0721,actors:64,capital:"Capital político-institucional",ft:"Fundación Territorial Paisano",opportunities:9},
{name:"Medellín",dept:"Antioquia",x:45,y:35,lat:6.2442,lng:-75.5812,actors:39,capital:"Capital financiero",ft:"Fundación Territorial Medellín",opportunities:6},
{name:"Alto Putumayo",dept:"Putumayo",x:50,y:77,lat:1.2020,lng:-76.9200,actors:28,capital:"Capital natural",ft:"Fundación Putumayo Florece",opportunities:4},
{name:"Guasca",dept:"Cundinamarca",x:58,y:50,lat:4.8661,lng:-73.8766,actors:36,capital:"Capital natural",ft:"Guasca Regenerativa",opportunities:7},
{name:"Cali",dept:"Valle del Cauca",x:39,y:60,lat:3.4516,lng:-76.5320,actors:30,capital:"Capital social",ft:"Cali Territorio en Acción",opportunities:5},
{name:"Montes de María",dept:"Bolívar / Sucre",x:47,y:20,lat:9.7170,lng:-75.1200,actors:31,capital:"Capital cultural",ft:"Sembrando Paz Montes de María",opportunities:6},
{name:"El Tambo",dept:"Cauca",x:37,y:66,lat:2.4510,lng:-76.8100,actors:24,capital:"Capital humano",ft:"Creamos El Tambo",opportunities:3},
{name:"Florencia",dept:"Caquetá",x:55,y:70,lat:1.6144,lng:-75.6062,actors:22,capital:"Capital natural",ft:"Agua, Vida y Paz",opportunities:3},
{name:"Alta Cuenca Río Bogotá",dept:"Cundinamarca",x:61,y:49,lat:5.2160,lng:-73.5900,actors:51,capital:"Capital natural",ft:"Alta Cuenca Río Bogotá",opportunities:5}
];

const actorTypes=["Organización de la sociedad civil","Fundación Territorial","Empresa local","Emprendimiento local","Colectivo comunitario","Institución pública","Universidad / centro de conocimiento","Cooperante / aliado filantrópico","Liderazgo individual"];
const capitals=["Capital social","Capital natural","Capital cultural","Capital humano","Capital financiero","Capital físico","Capital intelectual","Capital político-institucional"];
const topics=["Ambiente y regeneración","Seguridad alimentaria","Cultura","Juventud","Género","Paz y reconciliación","Educación","Economía local","Gobernanza comunitaria","Salud comunitaria","Agua y territorio"];
const names=["Asociación Agroecológica de Guasca","Colectivo Jóvenes del Río","Red de Mujeres Sembradoras","Empresa Local de Economía Circular","Universidad Aliada del Territorio","Fundación Barichara Regenerativa","Fundación Territorial Paisano","Cooperativa Saberes del Monte","Mesa de Agua y Territorio","Agencia Creativa Local","Red de Productoras Campesinas","Instituto de Innovación Social","Colectivo Cultural Raíces","Emprendimiento Alimentos del Territorio","Consejo Juvenil Comunitario","Fundación Putumayo Florece","Corporación Caminos de Paz","Escuela de Liderazgos Locales","Red Ambiental Alta Cuenca","Empresa de Alimentos Saludables"];

const actors=Array.from({length:58},(_,i)=>{
 const territory=territories[i%territories.length], type=actorTypes[i%actorTypes.length], capital=capitals[(i*3)%capitals.length];
 return {
  id:`ACT-${String(i+1).padStart(3,"0")}`,
  nombre:names[i%names.length]+(i>=names.length?` ${Math.floor(i/names.length)+1}`:""),
  tipo:type,territorio:territory.name,departamento:territory.dept,capitalPrincipal:capital,
  capitalesSecundarios:[capitals[(i+2)%capitals.length],capitals[(i+5)%capitals.length]],
  temas:[topics[(i*2)%topics.length],topics[(i*2+3)%topics.length]],
  descripcion:type==="Fundación Territorial"?"Actor articulador territorial que moviliza recursos, confianza y capacidades locales para fortalecer iniciativas comunitarias.":"Iniciativa territorial con capacidades locales, vínculos comunitarios y potencial de articulación con otros actores del ecosistema.",
  recursosDisponibles:[["Voluntariado especializado","Red comunitaria","Conocimiento local"],["Espacios de encuentro","Metodologías de formación","Red de compradores"],["Mentoría técnica","Datos territoriales","Capacidad logística"]][i%3],
  necesidades:[["Fortalecimiento administrativo","Financiación semilla"],["Comercialización","Diseño de marca"],["Gobernanza","Medición de impacto"],["Alianzas empresariales","Mentoría financiera"]][i%4],
  nivelConfianza:3+(i%3),capacidadAbsorcion:["Baja","Media","Alta"][i%3],nivelArticulacion:["Bajo","Medio","Alto"][i%3],
  fundacionTerritorialRelacionada:territory.ft,estadoPerfil:["Validado","Pendiente","Desactualizado","Validado"][i%4],
  conexionesActuales:2+(i%9),oportunidadesSugeridas:1+(i%5)
 }
});

const opportunities=[
{need:"Diseño de marca comunitaria",seeker:"Colectivo Jóvenes del Río",provider:"Agencia Creativa Local",resource:"Voluntariado profesional",score:92,status:"Sugerida",territory:"Montes de María",reason:"Alta complementariedad entre necesidad creativa y recurso profesional; confianza media-alta y vínculo territorial cercano."},
{need:"Canal de comercialización",seeker:"Asociación Agroecológica de Guasca",provider:"Empresa de Alimentos Saludables",resource:"Red de compradores",score:87,status:"En contacto",territory:"Guasca",reason:"Coincidencia entre producción agroecológica, capital natural y acceso a mercados locales/regionales."},
{need:"Mentoría financiera",seeker:"Fundación Territorial en formación de El Tambo",provider:"Universidad Aliada del Territorio",resource:"Equipo de investigación y formación",score:81,status:"Sugerida",territory:"El Tambo",reason:"La universidad puede aportar formación y acompañamiento técnico para fortalecer capacidades de absorción de recursos."},
{need:"Fortalecimiento en gobernanza",seeker:"Colectivo Comunitario de Alto Putumayo",provider:"Fundación Territorial Paisano",resource:"Asesoría entre pares",score:78,status:"En proceso",territory:"Alto Putumayo",reason:"La experiencia de una Fundación Territorial consolidada puede transferirse mediante aprendizaje entre pares."},
{need:"Datos sobre iniciativas ambientales",seeker:"Red Ambiental Alta Cuenca",provider:"Instituto de Innovación Social",resource:"Sistematización y análisis de información",score:84,status:"Concretada",territory:"Alta Cuenca Río Bogotá",reason:"Coincidencia alta entre necesidad de evidencia ambiental y capacidad técnica de análisis."}
];

let active="Inicio";
let selectedActor=actors[0];
let selectedTerritory=territories[4];
let selectedOpportunity=opportunities[0];
let selectedNetworkNode=null;
let mapFilters={
  territorio:"Todos",
  tipo:"Todos",
  capital:"Todos",
  tema:"Todos",
  confianza:"Todos",
  capacidad:"Todos"
};

function hasActiveMapFilters(){
  return Object.values(mapFilters).some(v=>v!=="Todos");
}

function optionTag(value,label,current){
  return `<option value="${value}" ${current===value?"selected":""}>${label||value}</option>`;
}

function mapFilteredActors(){
  return actors.filter(a=>{
    const f=mapFilters;

    const matchTerritory=f.territorio==="Todos" || a.territorio===f.territorio;
    const matchType=f.tipo==="Todos" || a.tipo===f.tipo;
    const matchCapital=f.capital==="Todos" || a.capitalPrincipal===f.capital || a.capitalesSecundarios.includes(f.capital);
    const matchTopic=f.tema==="Todos" || a.temas.includes(f.tema);
    
    const matchTrust=
      f.confianza==="Todos" ||
      (f.confianza==="Alta" && a.nivelConfianza>=4) ||
      (f.confianza==="Media" && a.nivelConfianza===3) ||
      (f.confianza==="Baja" && a.nivelConfianza<=2) ||
      String(a.nivelConfianza)===f.confianza;

    const matchCapacity=f.capacidad==="Todos" || a.capacidadAbsorcion===f.capacidad;

    return matchTerritory && matchType && matchCapital && matchTopic && matchTrust && matchCapacity;
  });
}

function territoryMatchInfo(){
  const filtered=mapFilteredActors();
  const filtering=hasActiveMapFilters();

  return territories.map(t=>{
    const matchingActors=filtered.filter(a=>a.territorio===t.name);

    return {
      ...t,
      matchCount:filtering ? matchingActors.length : t.actors,
      matchingActors
    };
  });
}

function updateMapFilter(key,value){
  mapFilters[key]=value;

  const matches=territoryMatchInfo().filter(t=>t.matchCount>0);

  if(matches.length && !matches.some(t=>t.name===selectedTerritory.name)){
    selectedTerritory=territories.find(t=>t.name===matches[0].name) || selectedTerritory;
  }

  render();
}

function resetMapFilters(){
  mapFilters={
    territorio:"Todos",
    tipo:"Todos",
    capital:"Todos",
    tema:"Todos",
    confianza:"Todos",
    capacidad:"Todos"
  };
  render();
}
  let territoriaMap=null;

function initTerritorialMap(){
  setTimeout(()=>{
    const el=document.getElementById("territoriaMap");
    if(!el) return;

    if(typeof L==="undefined"){
      el.innerHTML=`
        <div style="padding:22px;color:#66716d">
          No fue posible cargar el mapa. Revisa la conexión a internet o la carga de Leaflet.
        </div>`;
      return;
    }

    if(territoriaMap){
      territoriaMap.remove();
      territoriaMap=null;
    }

    const filtering=hasActiveMapFilters();
    const matchInfo=territoryMatchInfo();
    const visibleTerritories=filtering ? matchInfo.filter(t=>t.matchCount>0) : matchInfo;

    territoriaMap=L.map("territoriaMap",{
      scrollWheelZoom:false,
      zoomControl:true
    }).setView([4.5709,-74.2973],6);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:18,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(territoriaMap);

    const bounds=[];

    visibleTerritories.forEach(t=>{
      if(typeof t.lat!=="number" || typeof t.lng!=="number") return;

      const realIndex=territories.findIndex(x=>x.name===t.name);
      const isSelected=selectedTerritory.name===t.name;
      const markerValue=filtering ? t.matchCount : t.opportunities;

      const marker=L.marker([t.lat,t.lng],{
        icon:L.divIcon({
          className:"territoria-marker-shell",
          html:`<div class="territoria-div-marker ${filtering?"filtered":""} ${isSelected?"selected":""}">${markerValue}</div>`,
          iconSize:[38,38],
          iconAnchor:[19,19]
        })
      }).addTo(territoriaMap);

      marker.bindTooltip(`
        <strong>${t.name}</strong><br>
        ${t.dept}<br>
        ${filtering 
          ? `${t.matchCount} coincidencia${t.matchCount===1?"":"s"} con los filtros`
          : `${t.actors} actores · ${t.opportunities} oportunidades`
        }
      `);

      marker.on("click",()=>{
        selectedTerritory=territories[realIndex];
        render();
      });

      bounds.push([t.lat,t.lng]);
    });

    if(bounds.length===1){
      territoriaMap.setView(bounds[0],8);
    }else if(bounds.length>1){
      territoriaMap.fitBounds(bounds,{padding:[35,35]});
    }

    setTimeout(()=>territoriaMap.invalidateSize(),120);
  },0);
}
const navItems=["Inicio","Mapa territorial","Directorio de actores","Perfil de actor","Red de relaciones","Oportunidades","Reportes","Actualizar datos"];

function viewRed(){
 const visibleActors=actors.slice(0,24);

 const typeColors={
   "Fundación Territorial":"#4F7C45",
   "Empresa local":"#C77945",
   "Emprendimiento local":"#C77945",
   "Institución pública":"#305C5A",
   "Universidad / centro de conocimiento":"#8A7A55",
   "Cooperante / aliado filantrópico":"#9B6F45",
   "Organización de la sociedad civil":"#A8B88A",
   "Colectivo comunitario":"#7FAF99",
   "Liderazgo individual":"#B68B5E"
 };

 function nodeColor(type){
   return typeColors[type] || "#A8B88A";
 }

 function shortName(name){
   return name
     .replace("Fundación Territorial ","FT ")
     .replace("Fundación ","Fund. ")
     .replace("Asociación ","Asoc. ")
     .replace("Universidad ","Univ. ")
     .split(" ")
     .slice(0,4)
     .join(" ");
 }

 const clusterCenters={
   "Fundación Territorial":{x:450,y:245},
   "Organización de la sociedad civil":{x:250,y:170},
   "Colectivo comunitario":{x:255,y:355},
   "Empresa local":{x:655,y:170},
   "Emprendimiento local":{x:660,y:350},
   "Institución pública":{x:450,y:95},
   "Universidad / centro de conocimiento":{x:450,y:430},
   "Cooperante / aliado filantrópico":{x:735,y:260},
   "Liderazgo individual":{x:165,y:260}
 };

 const nodes=visibleActors.map((a,i)=>{
   const center=clusterCenters[a.tipo] || {x:450,y:260};
   const angle=(i*137.5)%360*Math.PI/180;
   const radius=28+(i%4)*17;

   return {
     ...a,
     x:center.x+Math.cos(angle)*radius,
     y:center.y+Math.sin(angle)*radius,
     r:12+a.conexionesActuales*1.2,
     centrality:Math.min(96,52+a.conexionesActuales*5+a.nivelConfianza*4)
   };
 });

 const links=nodes.slice(0,26).map((n,i)=>{
   const target=nodes[(i*5+3)%nodes.length];
   return {
     from:n,
     to:target,
     strength:1+(i%4),
     type:i%3===0?"Colaboración activa":i%3===1?"Confianza previa":"Oportunidad sugerida"
   };
 });

 const selected=selectedNetworkNode 
   ? nodes.find(n=>n.id===selectedNetworkNode) || nodes[0]
   : nodes.sort((a,b)=>b.centrality-a.centrality)[0];

 selectedNetworkNode=selected.id;

 const catalysts=[...nodes]
   .sort((a,b)=>b.centrality-a.centrality)
   .slice(0,5);

 function curvePath(a,b,i){
   const dx=b.x-a.x;
   const dy=b.y-a.y;
   const mx=(a.x+b.x)/2;
   const my=(a.y+b.y)/2;
   const curve=(i%2===0?1:-1)*28;
   const cx=mx-dy/Math.sqrt(dx*dx+dy*dy || 1)*curve;
   const cy=my+dx/Math.sqrt(dx*dx+dy*dy || 1)*curve;
   return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
 }

 const legendTypes=[
   "Fundación Territorial",
   "Organización de la sociedad civil",
   "Empresa local",
   "Institución pública",
   "Universidad / centro de conocimiento",
   "Cooperante / aliado filantrópico"
 ];

 return `
 ${section(
   "Análisis relacional",
   "Red de relaciones, confianza y colaboración",
   "Esta vista permite identificar actores puente, conexiones intersectoriales, vínculos de confianza y oportunidades para fortalecer el capital relacional del ecosistema."
 )}

 <div class="grid stats">
   ${stat("🕸️","Densidad de red","0.42","Nivel estimado de conexión")}
   ${stat("👥","Actores puente","12","Nodos con alta centralidad")}
   ${stat("🤝","Conexiones intersectoriales","48","Relaciones entre actores distintos")}
   ${stat("⚠️","Actores aislados","9","Requieren activación")}
 </div>

 <div class="grid mapgrid">
   <div class="card">
     <div class="network-wrap">
       <svg viewBox="0 0 900 540" class="network">
         <defs>
           <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
             <stop offset="0%" stop-color="#F3E6D3" stop-opacity="1"/>
             <stop offset="100%" stop-color="#F3E6D3" stop-opacity="0"/>
           </radialGradient>
         </defs>

         <circle cx="450" cy="260" r="115" fill="url(#centerGlow)"></circle>
         <text x="450" y="252" class="network-center-label">Capital relacional</text>
         <text x="450" y="274" class="network-center-small">confianza · recursos · articulación</text>

         ${links.map((l,i)=>`
           <path 
             d="${curvePath(l.from,l.to,i)}" 
             class="network-link ${l.strength>=3?"strong":""}">
             <title>${l.type}: ${l.from.nombre} → ${l.to.nombre}</title>
           </path>
         `).join("")}

         ${nodes.map((n,i)=>`
           <g 
             class="network-node ${selected.id===n.id?"selected":""}" 
             onclick="selectedNetworkNode='${n.id}';render()">
             <circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${nodeColor(n.tipo)}"></circle>
             <title>${n.nombre} · ${n.tipo} · ${n.territorio}</title>
             ${n.centrality>=78 || selected.id===n.id ? `
               <text x="${n.x}" y="${n.y+n.r+18}" text-anchor="middle" class="network-label">${shortName(n.nombre)}</text>
               <text x="${n.x}" y="${n.y+n.r+33}" text-anchor="middle" class="network-subtitle">${n.territorio}</text>
             ` : ""}
           </g>
         `).join("")}
       </svg>
     </div>

     <div class="network-legend">
       ${legendTypes.map(t=>`
         <span class="legend-item">
           <span class="legend-dot" style="background:${nodeColor(t)}"></span>
           ${t.replace("Organización de la sociedad civil","OSC").replace("Universidad / centro de conocimiento","Universidad")}
         </span>
       `).join("")}
     </div>
   </div>

   <div class="card">
     <p class="eyebrow">Actor seleccionado</p>
     <h3 style="color:var(--blue);font-size:25px;margin:0 0 8px">${selected.nombre}</h3>
     <p style="color:#66716d;line-height:1.5;margin-top:0">${selected.descripcion}</p>

     ${info("Tipo de actor",selected.tipo)}
     ${info("Territorio",selected.territorio)}
     ${info("Capital principal",selected.capitalPrincipal)}
     ${info("Nivel de confianza",selected.nivelConfianza+"/5")}
     ${info("Conexiones actuales",selected.conexionesActuales)}
     ${info("Centralidad estimada",selected.centrality+"%")}

     <button class="btn" style="width:100%;margin-top:8px" onclick="selectedActor=actors.find(a=>a.id==='${selected.id}');setActive('Perfil de actor')">
       Ver ficha del actor
     </button>
   </div>
 </div>

 <div class="grid two" style="margin-top:18px">
   <div class="card">
     <h3 style="color:var(--blue);font-size:24px;margin-top:0">Actores catalizadores</h3>
     <p style="color:#66716d;line-height:1.5">
       Nodos con mayor capacidad para conectar confianza, saberes, recursos y oportunidades entre sectores.

     ${catalysts.map(a=>`
       <div class="info-row" onclick="selectedNetworkNode='${a.id}';render()" style="cursor:pointer">

         </div>
       </div>
     `).join("")}
   </div>

   <div class="card">
     <h3 style="color:var(--blue);font-size:24px;margin-top:0">Lectura estratégica</h3>
     <p style="color:#5f6b67;line-height:1.55">
       La red permite identificar qué actores conectan grupos distintos, dónde se concentran relaciones de confianza y qué vínculos podrían activarse para reducir fragmentación. Los nodos más grandes representan actores con mayor número de conexiones y mayor potencial de articulación.
     </p>
     <div class="grid two">
       ${info("Relación más relevante","Confianza previa")}
       ${info("Brecha prioritaria","Actores aislados")}
       ${info("Acción sugerida","Mesa de articulación")}
       ${info("Uso del dato","Activar matching")}
     </div>
   </div>
 </div>`;
}

 <div class="grid">${opportunities.map((o,i)=>`<div class="card opp ${selectedOpportunity.need===o.need?"selected":""}" onclick="selectedOpportunity=opportunities[${i}];render()"><div style="display:flex;justify-content:space-between;gap:18px"><div><h3 style="color:var(--blue);margin:0">${o.need} ${badge(o.status)}</h3><p><strong>${o.seeker}</strong> necesita conectar con <strong>${o.provider}</strong></p><small>Recurso disponible: ${o.resource} · ${o.territory}</small></div><div class="score">${o.score}%</div></div></div>`).join("")}</div>

 </div>`;
}

function viewReportes(){
 const alerts=["Guasca presenta alta concentración de actores ambientales, pero baja conexión con empresas locales. Se recomienda activar una mesa de economía regenerativa.","Montes de María cuenta con capital cultural fuerte, pero requiere mayor articulación con financiadores.","Alto Putumayo presenta actores comunitarios activos, pero baja densidad de relaciones intersectoriales.","Bogotá muestra alto potencial para pilotear mecanismos de coinversión."];
 return `${section("Reportes territoriales","Alertas, prioridades y decisiones sugeridas","El sistema transforma datos dispersos en insumos para orientar inversión social, acompañamiento territorial y expansión de Fundaciones Territoriales.")}
 <div class="grid two">${chartCard("Densidad de red por territorio",territories.slice(0,7).map((t,i)=>({name:t.name.slice(0,11),value:28+i*6})))}${chartCard("Oportunidades de inversión social",[{name:"Ambiente",value:12},{name:"Cultura",value:9},{name:"Juventud",value:8},{name:"Economía",value:7},{name:"Gobernanza",value:6}],"blue")}</div>
 <div class="grid two" style="margin-top:20px">${alerts.map(a=>`<div class="card alert"><div class="spark">⚠️</div><p>${a}</p></div>`).join("")}</div>
 <div class="filters" style="margin-top:20px"><button class="btn" onclick="toast('Reporte descargado en modo demo.')">Descargar reporte</button><button class="btn" onclick="toast('Recomendación generada correctamente.')">Generar recomendación</button><button class="btn" onclick="toast('Territorio priorizado para análisis.')">Priorizar territorio</button></div>`;
}

function viewActualizar(){
 return `${section("Gobernanza de datos","Actualizar información del ecosistema","Formulario simulado para que los nodos territoriales mantengan viva y validada la información de actores, recursos y necesidades.")}
 <div class="card"><div class="grid form">
 <input placeholder="Nombre del actor"><input placeholder="Departamento"><textarea placeholder="Descripción"></textarea><textarea placeholder="Recursos disponibles"></textarea><textarea placeholder="Necesidades"></textarea>
 <select><option>Tipo de actor</option>${actorTypes.map(x=>`<option>${x}</option>`).join("")}</select>
 <select><option>Territorio</option>${territories.map(x=>`<option>${x.name}</option>`).join("")}</select>
 <select><option>Capital principal</option>${capitals.map(x=>`<option>${x}</option>`).join("")}</select>
 <select><option>Tema de trabajo</option>${topics.map(x=>`<option>${x}</option>`).join("")}</select>
 <select><option>Nivel de confianza</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
 <select><option>Capacidad de absorción</option><option>Baja</option><option>Media</option><option>Alta</option></select>
 </div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn" onclick="toast('Información enviada para validación por el nodo territorial.')">Enviar actualización</button></div></div>`;
}

render();
if(active==="Directorio de actores") renderDirectoryTable();
const oldRender=render;
render=function(){oldRender(); if(active==="Directorio de actores") setTimeout(renderDirectoryTable,0);}
</script>
